---
- name: Deploy UVV Unterweisungen
  hosts: uvv
  become: true
  gather_facts: true
  vars_files:
    - secrets.yml

  tasks:
    - name: Check target OS and required settings
      ansible.builtin.assert:
        that:
          - ansible_distribution in ["AlmaLinux", "Debian"]
          - uvv_domain | length > 0
          - uvv_domain not in ["uvv.example.org", "example.org"]
          - uvv_admin_password | length >= 10
          - uvv_admin_password not in ["REPLACE_WITH_A_LONG_UNIQUE_PASSWORD", "bitte-aendern", "bitte-aendern!", "changeme123", "passwort123", "password123"]
          - uvv_ssh_allowed_cidrs | length > 0 or not uvv_manage_host_firewall
          - uvv_proxy_mode in ["caddy", "external"]
        fail_msg: >-
          Use AlmaLinux or Debian, set uvv_domain and a 10+ character initial
          admin password, and set uvv_ssh_allowed_cidrs before managing the
          host firewall.

    - name: Install Docker repository prerequisites on Debian
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true
      when: ansible_distribution == "Debian"

    - name: Create apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: ansible_distribution == "Debian"

    - name: Download Docker signing key on Debian
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"
      when: ansible_distribution == "Debian"

    - name: Add Docker apt repository on Debian
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_architecture in ['x86_64', 'amd64']
          else 'arm64' }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable
        filename: docker
        state: present
      when: ansible_distribution == "Debian"

    - name: Install Docker repository prerequisites on AlmaLinux
      ansible.builtin.dnf:
        name: dnf-plugins-core
        state: present
        update_cache: true
      when: ansible_distribution == "AlmaLinux"

    - name: Configure Docker CentOS-compatible repository on AlmaLinux
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/centos/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
        owner: root
        group: root
        mode: "0644"
      when: ansible_distribution == "AlmaLinux"

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.package:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Install firewalld on AlmaLinux when host firewall is managed
      ansible.builtin.dnf:
        name: firewalld
        state: present
      when:
        - ansible_distribution == "AlmaLinux"
        - uvv_manage_host_firewall

    - name: Enable firewalld on AlmaLinux
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true
      when:
        - ansible_distribution == "AlmaLinux"
        - uvv_manage_host_firewall

    - name: Remove unrestricted SSH service rule on AlmaLinux
      ansible.posix.firewalld:
        service: ssh
        state: disabled
        permanent: true
        immediate: true
      when:
        - ansible_distribution == "AlmaLinux"
        - uvv_manage_host_firewall

    - name: Allow SSH from configured CIDRs on AlmaLinux
      ansible.posix.firewalld:
        rich_rule: >-
          rule family="{{ 'ipv6' if ':' in item else 'ipv4' }}"
          source address="{{ item }}"
          port port="{{ uvv_ssh_port }}" protocol="tcp" accept
        state: enabled
        permanent: true
        immediate: true
      loop: "{{ uvv_ssh_allowed_cidrs }}"
      when:
        - ansible_distribution == "AlmaLinux"
        - uvv_manage_host_firewall

    - name: Allow web traffic on AlmaLinux
      ansible.posix.firewalld:
        service: "{{ item }}"
        state: enabled
        permanent: true
        immediate: true
      loop:
        - http
        - https
      when:
        - ansible_distribution == "AlmaLinux"
        - uvv_manage_host_firewall

    - name: Install UFW on Debian when host firewall is managed
      ansible.builtin.apt:
        name: ufw
        state: present
      when:
        - ansible_distribution == "Debian"
        - uvv_manage_host_firewall

    - name: Set Debian firewall defaults
      ansible.builtin.command:
        argv:
          - ufw
          - default
          - "{{ item }}"
          - "{{ 'deny' if item == 'incoming' else 'allow' }}"
      loop:
        - incoming
        - outgoing
      changed_when: false
      when:
        - ansible_distribution == "Debian"
        - uvv_manage_host_firewall

    - name: Allow SSH from configured CIDRs on Debian
      ansible.builtin.command:
        argv:
          - ufw
          - allow
          - from
          - "{{ item }}"
          - to
          - any
          - port
          - "{{ uvv_ssh_port | string }}"
          - proto
          - tcp
      loop: "{{ uvv_ssh_allowed_cidrs }}"
      changed_when: false
      when:
        - ansible_distribution == "Debian"
        - uvv_manage_host_firewall

    - name: Allow HTTPS ingress on Debian
      ansible.builtin.command:
        argv:
          - ufw
          - allow
          - "{{ item }}"
          - proto
          - tcp
      loop:
        - "80"
        - "443"
      changed_when: false
      when:
        - ansible_distribution == "Debian"
        - uvv_manage_host_firewall

    - name: Enable UFW on Debian
      ansible.builtin.command:
        argv:
          - ufw
          - --force
          - enable
      changed_when: false
      when:
        - ansible_distribution == "Debian"
        - uvv_manage_host_firewall

    - name: Create application and data directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ uvv_install_dir }}"
          owner: root
          group: root
          mode: "0755"
        - path: "{{ uvv_data_dir }}"
          owner: "{{ uvv_app_uid }}"
          group: "{{ uvv_app_gid }}"
          mode: "0750"
        - path: "{{ uvv_backup_dir }}"
          owner: "{{ uvv_app_uid }}"
          group: "{{ uvv_app_gid }}"
          mode: "0700"

    - name: Write protected app environment file
      ansible.builtin.template:
        src: templates/uvv.env.j2
        dest: "{{ uvv_install_dir }}/.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Write Docker Compose configuration
      ansible.builtin.template:
        src: templates/docker-compose.yml.j2
        dest: "{{ uvv_install_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"

    - name: Write Caddy configuration
      ansible.builtin.template:
        src: templates/Caddyfile.j2
        dest: "{{ uvv_install_dir }}/Caddyfile"
        owner: root
        group: root
        mode: "0644"
      when: uvv_proxy_mode == "caddy"

    - name: Write SQLite online backup script
      ansible.builtin.template:
        src: templates/backup.py.j2
        dest: "{{ uvv_install_dir }}/backup.py"
        owner: root
        group: root
        mode: "0644"
      when: uvv_backup_enabled

    - name: Pull configured app image
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - pull
      args:
        chdir: "{{ uvv_install_dir }}"
      changed_when: true

    - name: Start UVV application and selected proxy
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - up
          - -d
          - --remove-orphans
      args:
        chdir: "{{ uvv_install_dir }}"
      changed_when: true

    - name: Configure daily SQLite backup cron job
      ansible.builtin.cron:
        name: UVV Unterweisungen SQLite backup
        user: root
        minute: "{{ uvv_backup_minute }}"
        hour: "{{ uvv_backup_hour }}"
        job: >-
          cd {{ uvv_install_dir }} &&
          docker compose exec -T uvv-unterweisungen python /backup.py &&
          find {{ uvv_backup_dir }} -maxdepth 1 -type f -name 'uvv-*.tar.gz'
          -mtime +{{ uvv_backup_retention_days }} -delete
          >> /var/log/uvv-backup.log 2>&1
      when: uvv_backup_enabled

    - name: Remove backup cron job when backups are disabled
      ansible.builtin.cron:
        name: UVV Unterweisungen SQLite backup
        state: absent
      when: not uvv_backup_enabled

    - name: Wait for app health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ uvv_http_port }}/healthz"
        status_code: 200
      register: uvv_health
      retries: 12
      delay: 5
      until: uvv_health.status == 200
      when: uvv_proxy_mode == "external"

    - name: Wait for app container health
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{{ '{{' }}.State.Health.Status{{ '}}' }}"
          - uvv-unterweisungen
      register: uvv_container_health
      retries: 12
      delay: 5
      until: uvv_container_health.stdout == "healthy"
      changed_when: false
      when: uvv_proxy_mode == "caddy"
